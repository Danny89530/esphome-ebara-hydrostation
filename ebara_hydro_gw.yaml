# Ebara Hydrostation Gateway.
#
# esp-idf framework is required (not arduino) so the Bluetooth host-stack
# Kconfig choice (NimBLE) can be set directly.

esphome:
  name: ebara-hydro-gw
  friendly_name: "Ebara Hydro GW"

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_BT_ENABLED: "y"
      CONFIG_BT_NIMBLE_ENABLED: "y"
      CONFIG_BT_BLUEDROID_ENABLED: "n"
      # Persist bond keys (LTK) in NVS so they survive ESP reboots.
      CONFIG_BT_NIMBLE_NVS_PERSIST: "y"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "ebara-hydro-gw-fallback"
    password: "hydrostation"

logger:
  # Connection/bonding/polling lifecycle events and errors/warnings are
  # logged at INFO, so this level is quiet in normal operation. Per-poll
  # traffic (>>> / <<< commands) and internal state transitions are logged
  # at DEBUG — set `level: DEBUG` for detailed troubleshooting.
  level: INFO

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80
  version: 3

external_components:
  - source:
      type: local
      path: components

ebara_hydrostation:
  # Live values (status, pressures, current, alarms) are read every
  # update_interval; slow-changing ones (working hours, temperature, DC bus
  # voltage, start pressure) every 60 s. This is only the default of the
  # "Update Interval" entity (2-300 s), adjustable at runtime.
  update_interval: 10s
  # No default_target_mac: the pump is discovered via BLE scan and selected in
  # the Home Assistant "Ebara Hydrostation" config flow, which stores it in the
  # ESP32's own flash.

  target_mac:
    name: "Target MAC"
    id: target_mac_input
    mode: text
  gw_status:
    name: "GW Status"
    id: gw_status_sensor
  errors_text:
    name: "Errors"
  discovered:
    name: "Discovered Hydrostations"

  # Pump state, decoded from the status word as in the official app.
  pump_status:
    name: "Pump Status"
  external_stop:
    name: "External Stop"
  status_bit10:
    name: "Status Bit 10 (undocumented)"
  pressure_unit:
    name: "Pressure Unit"
  device_name:
    name: "Pump Device Name"

  # Pressures are always published in bar.
  target_pressure:
    name: "Target Pressure"
  start_pressure:
    name: "Start Pressure"
  actual_pressure:
    name: "Actual Pressure"
  delta_pressure:
    name: "Delta Pressure"
  motor_current:
    name: "Motor Current"
  working_hours:
    name: "Working Hours"
  motor_frequency:
    name: "Motor Frequency"
  module_temperature:
    name: "Module Temperature"
  dc_bus_voltage:
    name: "DC Bus Voltage"
  pump_load:
    name: "Estimated Pump Load"
  firmware_version:
    name: "Firmware Version"
  hardware_version:
    name: "Hardware Version"
  serial_number:
    name: "Serial Number"

  motor_running:
    name: "Motor Running"
  motor_enabled:
    name: "Motor Enabled"
  motor_error:
    name: "Motor Error"

  motor:
    name: "Motor"
  enable:
    name: "Gateway Enable"

  target_pressure_setpoint:
    name: "Target Pressure Setpoint"
  delta_pressure_setpoint:
    name: "Delta Pressure Setpoint"
  poll_interval:
    name: "Update Interval"

button:
  - platform: restart
    name: "ESP Reboot"
